services:
  postgres:
    image: postgres:16-alpine
    container_name: eventapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventapp_db
      POSTGRES_USER: eventapp_user
      POSTGRES_PASSWORD: eventapp_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventapp_user -d eventapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
